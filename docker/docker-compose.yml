name: zunera-backend

services:
  app:
    build: .
    image: zunera/php:8.5
    logging: &bounded_logging
      driver: local
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      - ../:/var/www/html
    depends_on:
      dbmysql:
        condition: service_healthy
      mailpit:
        condition: service_started

  nginx:
    image: nginx:stable-alpine
    volumes:
      - ../:/var/www/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      default:
        aliases:
          - ${SERVERNAME_REST}
    depends_on:
      app:
        condition: service_started
    ports:
      - "8001:80"

  scheduler:
    image: zunera/php:8.5
    command: ["php", "artisan", "schedule:work"]
    logging: *bounded_logging
    restart: unless-stopped
    volumes:
      - ../:/var/www/html
    depends_on:
      app:
        condition: service_started

  auth-mail-worker:
    image: zunera/php:8.5
    command: ["php", "artisan", "queue:work", "database", "--queue=auth-mail", "--sleep=3", "--tries=3", "--timeout=60"]
    logging: *bounded_logging
    restart: unless-stopped
    volumes:
      - ../:/var/www/html
    depends_on:
      app:
        condition: service_started
      dbmysql:
        condition: service_healthy
      mailpit:
        condition: service_started

  dbmysql:
    image: mysql:8.4
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - MYSQL_DATABASE=${MYSQL_DATABASE}
      - MYSQL_USER=${MYSQL_USER}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
#    ports:
#      - "${DB_FORWARD_PORT}:3306"
    volumes:
      - appdb:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 5s
      retries: 20

  mailpit:
    image: axllent/mailpit:v1.30.0
    ports:
      - "1026:1025"
      - "8026:8025"

volumes:
  appdb:
